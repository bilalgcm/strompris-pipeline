name: Fetch Daily Prices

on:
  schedule:
    # GitHub runs scheduled workflows "best effort": often hours late, sometimes skipped.
    # Several runs off the top of the hour make it more likely one lands on time.
    # The API also fills in missing prices itself (api/refresh.py).
    - cron: '30 12 * * *'   # 13:30 winter / 14:30 summer Oslo, after day-ahead publication
    - cron: '45 14 * * *'   # retry
    - cron: '17 20 * * *'   # evening retry
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install requests "psycopg[binary]"
      - name: Fetch prices and weather
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd ingest && python -c "
          from datetime import date, timedelta
          from fetch_prices import fetch_prices
          from store import save_prices
          from fetch_weather import fetch_recent_weather, save_weather

          for area in ['NO1', 'NO2', 'NO3', 'NO4', 'NO5']:
              for d in [date.today(), date.today() + timedelta(days=1)]:
                  try:
                      prices = fetch_prices(d, area)
                      save_prices(prices, area)
                      print(f'Prices {area} {d}: {len(prices)} timer')
                  except Exception as e:
                      print(f'Prices {area} {d}: hoppet over ({e})')

          # Forecast API with past_days, not the archive: the archive rejects recent end dates
          # with 400, which stopped the weather data from 24 July 2026 without failing the run.
          # A failure here is now caught by the weather check in quality.py.
          try:
              times, temps = fetch_recent_weather(past_days=7)
              saved = save_weather(times, temps)
              print(f'Weather: {saved} timer lagret')
          except Exception as e:
              print(f'Weather: feilet ({e})')
          "
      - name: Save forecasts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          import json, os, psycopg, requests
          from datetime import datetime, timezone

          NEON = os.environ['DATABASE_URL']
          for area in ['NO1', 'NO2', 'NO3', 'NO4', 'NO5']:
              try:
                  data = requests.get(f'https://strompris-pipeline.fly.dev/forecast?area={area}').json()
                  with psycopg.connect(NEON) as conn:
                      with conn.cursor() as cur:
                          for p in data:
                              cur.execute(
                                  'INSERT INTO forecasts (price_area, time_start, forecast_nok_per_kwh) VALUES (%s, %s, %s) ON CONFLICT DO NOTHING',
                                  (area, p['time_start'], p['forecast_nok_per_kwh'])
                              )
                  print(f'Forecast {area}: {len(data)} timer lagret')
              except Exception as e:
                  print(f'Forecast {area}: feilet ({e})')
          "
      - name: Data-quality check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The 12:30 run only checks today, because tomorrow may not be published yet.
          # The 20:00 run and manual runs check today and tomorrow.
          CHECK_TOMORROW: ${{ github.event.schedule != '30 12 * * *' }}
        run: python ingest/quality.py
      - name: Fetch household consumption (Elhub open data)
        # Last step on purpose: if Elhub is down the run turns red, but prices and the
        # quality check above have already run. Re-fetches 16 days, since Elhub corrects values.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd ingest && python fetch_household.py
