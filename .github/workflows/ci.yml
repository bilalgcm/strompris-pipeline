name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        # Pinned: an unpinned install picked up ruff 0.17, whose new rules failed CI on old code
        run: pip install ruff==0.17.1 && ruff check .

      - name: Test
        run: pip install pytest -r mcp_server/requirements.txt && python -m pytest -q

      - name: Build Docker image
        run: |
          touch model/model.joblib
          docker build -t strompris-pipeline .
