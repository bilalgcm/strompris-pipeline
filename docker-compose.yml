services:
  db:
    image: postgres:16
    container_name: strompris-db
    environment:
      POSTGRES_USER: strom
      POSTGRES_PASSWORD: strom
      POSTGRES_DB: strompris
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: strompris-app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
    env_file:
      - .env
    depends_on:
      - db

volumes:
  pgdata:
